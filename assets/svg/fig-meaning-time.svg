<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif">
<rect width="1000" height="520" fill="#ffffff"/>
<text x="500" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">意义的时间结构：过去、现在、未来</text>
<text x="500" y="62" text-anchor="middle" font-size="14" fill="#666666">抑郁常是未来塌陷；焦虑常是未来过载；创伤常是过去入侵</text>
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"
markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#666666"/></marker></defs>
<line x1="100" y1="300" x2="900" y2="300" stroke="#666666" stroke-width="2" marker-end="url(#ah)"/>
<circle cx="220" cy="300" r="10" fill="#2f6db0" stroke="#2f6db0" stroke-width="1.6"/>
<text x="220" y="340" text-anchor="middle" font-size="18" fill="#2f6db0" font-weight="bold">过去</text>
<circle cx="500" cy="300" r="10" fill="#2e7d32" stroke="#2e7d32" stroke-width="1.6"/>
<text x="500" y="340" text-anchor="middle" font-size="18" fill="#2e7d32" font-weight="bold">现在</text>
<circle cx="780" cy="300" r="10" fill="#b8862f" stroke="#b8862f" stroke-width="1.6"/>
<text x="780" y="340" text-anchor="middle" font-size="18" fill="#b8862f" font-weight="bold">未来</text>
<text x="220" y="230" text-anchor="middle" font-size="12" fill="#2f6db0" font-weight="normal">可讲述的故事</text>
<text x="500" y="230" text-anchor="middle" font-size="12" fill="#2e7d32" font-weight="normal">可投入的行动</text>
<text x="780" y="230" text-anchor="middle" font-size="12" fill="#b8862f" font-weight="normal">可期待的方向</text>
<text x="220" y="400" text-anchor="middle" font-size="11" fill="#c62828" font-weight="normal">创伤：过去入侵</text>
<text x="500" y="430" text-anchor="middle" font-size="11" fill="#c62828" font-weight="normal">空虚：现在脱节</text>
<text x="780" y="400" text-anchor="middle" font-size="11" fill="#c62828" font-weight="normal">抑郁/焦虑：未来塌陷/过载</text>
<text x="500" y="480" text-anchor="middle" font-size="13" fill="#666666" font-weight="normal">存在主义治疗的工作：不是消除症状，而是重建三个维度（C）。</text>
</svg>