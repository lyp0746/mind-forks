<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif">
<rect width="1000" height="600" fill="#ffffff"/>
<text x="500" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">拉康的三界：想象、象征、实在</text>
<text x="500" y="62" text-anchor="middle" font-size="14" fill="#666666">三个环互相扣住；主体在它们的交界处被构成</text>
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"
markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#666666"/></marker></defs>
<circle cx="430" cy="245" r="130" fill="none" stroke="#2f6db0" stroke-width="2.6"/>
<text x="430" y="235" text-anchor="middle" font-size="19" fill="#2f6db0" font-weight="bold">想象界</text>
<text x="430" y="263" text-anchor="middle" font-size="11" fill="#666666" font-weight="normal">形象 / 自恋 / 二元</text>
<circle cx="570" cy="245" r="130" fill="none" stroke="#2e7d32" stroke-width="2.6"/>
<text x="570" y="235" text-anchor="middle" font-size="19" fill="#2e7d32" font-weight="bold">象征界</text>
<text x="570" y="263" text-anchor="middle" font-size="11" fill="#666666" font-weight="normal">语言 / 法则 / 大他者</text>
<circle cx="500" cy="375" r="130" fill="none" stroke="#8e5a9c" stroke-width="2.6"/>
<text x="500" y="365" text-anchor="middle" font-size="19" fill="#8e5a9c" font-weight="bold">实在界</text>
<text x="500" y="393" text-anchor="middle" font-size="11" fill="#666666" font-weight="normal">无法象征化的剩余</text>
<text x="500" y="520" text-anchor="middle" font-size="13" fill="#666666" font-weight="normal">三界不是三个房间，而是三种“被结构”的方式；病理取决于哪一界出了故障（C）。</text>
</svg>