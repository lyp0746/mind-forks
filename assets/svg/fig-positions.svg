<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif">
<rect width="1000" height="560" fill="#ffffff"/>
<text x="500" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">克莱因的两个位置：从分裂到整合</text>
<text x="500" y="62" text-anchor="middle" font-size="14" fill="#666666">不是两个阶段，而是两种组织经验的方式；成人也会在两者之间来回</text>
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"
markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#666666"/></marker></defs>
<line x1="90" y1="250" x2="910" y2="250" stroke="#cccccc" stroke-width="2"/>
<circle cx="220" cy="250" r="6" fill="#666666" stroke="#666666" stroke-width="1.6"/>
<text x="220" y="282" text-anchor="middle" font-size="12" fill="#666666" font-weight="normal">出生</text>
<circle cx="500" cy="250" r="6" fill="#666666" stroke="#666666" stroke-width="1.6"/>
<text x="500" y="282" text-anchor="middle" font-size="12" fill="#666666" font-weight="normal">约 6 个月</text>
<circle cx="780" cy="250" r="6" fill="#666666" stroke="#666666" stroke-width="1.6"/>
<text x="780" y="282" text-anchor="middle" font-size="12" fill="#666666" font-weight="normal">成人生活</text>
<rect x="110" y="110" width="300" height="110" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="1.4"/>
<text x="260" y="145" text-anchor="middle" font-size="17" fill="#c62828" font-weight="bold">偏执—分裂位置</text>
<text x="260" y="175" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="normal">全好 / 全坏；分裂、投射</text>
<text x="260" y="200" text-anchor="middle" font-size="12" fill="#666666" font-weight="normal">核心焦虑：被害</text>
<rect x="590" y="110" width="300" height="110" rx="8" fill="#eef7f0" stroke="#2e7d32" stroke-width="1.4"/>
<text x="740" y="145" text-anchor="middle" font-size="17" fill="#2e7d32" font-weight="bold">抑郁位置</text>
<text x="740" y="175" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="normal">好与坏在同一个对象里</text>
<text x="740" y="200" text-anchor="middle" font-size="12" fill="#666666" font-weight="normal">核心焦虑：因攻击而失去</text>
<line x1="410" y1="165" x2="590" y2="165" stroke="#b8862f" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="500" y="150" text-anchor="middle" font-size="13" fill="#b8862f" font-weight="normal">整合</text>
<line x1="590" y1="330" x2="410" y2="330" stroke="#666666" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#ah)"/>
<text x="500" y="356" text-anchor="middle" font-size="12" fill="#666666" font-weight="normal">压力下退回</text>
<text x="500" y="450" text-anchor="middle" font-size="13" fill="#666666" font-weight="normal">成人政治里的非黑即白、网暴、追星，都是偏执—分裂位置的回声（C）。</text>
</svg>