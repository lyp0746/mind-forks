<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif">
<rect width="1000" height="520" fill="#ffffff"/>
<text x="500" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">信息加工模型：内部被写成一条流水线</text>
<text x="500" y="62" text-anchor="middle" font-size="14" fill="#666666">输入 → 编码 → 存储 → 提取 → 输出；每一段都有容量限制</text>
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"
markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#666666"/></marker></defs>
<rect x="50" y="160" width="160" height="110" rx="10" fill="#fbfcfe" stroke="#2f6db0" stroke-width="1.4"/>
<text x="130" y="200" text-anchor="middle" font-size="15" fill="#2f6db0" font-weight="bold">输入</text>
<text x="130" y="228" text-anchor="middle" font-size="11" fill="#666666" font-weight="normal">刺激 / 任务</text>
<line x1="212" y1="215" x2="238" y2="215" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="240" y="160" width="160" height="110" rx="10" fill="#fbfcfe" stroke="#2e7d32" stroke-width="1.4"/>
<text x="320" y="200" text-anchor="middle" font-size="15" fill="#2e7d32" font-weight="bold">感觉登记</text>
<text x="320" y="228" text-anchor="middle" font-size="11" fill="#666666" font-weight="normal">几百毫秒</text>
<line x1="402" y1="215" x2="428" y2="215" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="430" y="160" width="160" height="110" rx="10" fill="#fbfcfe" stroke="#ef6c00" stroke-width="1.4"/>
<text x="510" y="200" text-anchor="middle" font-size="15" fill="#ef6c00" font-weight="bold">短时/工作记忆</text>
<text x="510" y="228" text-anchor="middle" font-size="11" fill="#666666" font-weight="normal">约 4 个组块</text>
<line x1="592" y1="215" x2="618" y2="215" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="620" y="160" width="160" height="110" rx="10" fill="#fbfcfe" stroke="#8e5a9c" stroke-width="1.4"/>
<text x="700" y="200" text-anchor="middle" font-size="15" fill="#8e5a9c" font-weight="bold">长时记忆</text>
<text x="700" y="228" text-anchor="middle" font-size="11" fill="#666666" font-weight="normal">编码 / 提取</text>
<line x1="782" y1="215" x2="808" y2="215" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="810" y="160" width="160" height="110" rx="10" fill="#fbfcfe" stroke="#c62828" stroke-width="1.4"/>
<text x="890" y="200" text-anchor="middle" font-size="15" fill="#c62828" font-weight="bold">输出</text>
<text x="890" y="228" text-anchor="middle" font-size="11" fill="#666666" font-weight="normal">反应 / 报告</text>
<line x1="310" y1="320" x2="360" y2="275" stroke="#ef6c00" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#ah)"/>
<text x="310" y="345" text-anchor="middle" font-size="12" fill="#ef6c00" font-weight="normal">注意：选择谁进来</text>
<line x1="500" y1="320" x2="500" y2="275" stroke="#8e5a9c" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#ah)"/>
<text x="500" y="345" text-anchor="middle" font-size="12" fill="#8e5a9c" font-weight="normal">复述：让它留下来</text>
<text x="500" y="440" text-anchor="middle" font-size="13" fill="#666666" font-weight="normal">这套模型的得：可计算、可检验；失：意义、身体、第一人称。</text>
</svg>