<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif">
<rect width="1000" height="520" fill="#ffffff"/>
<text x="500" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">人—情境交互：强情境压制差异，弱情境允许差异</text>
<text x="500" y="62" text-anchor="middle" font-size="14" fill="#666666">行为不是“人”或“情境”的单独函数，而是两者的交互</text>
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"
markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#666666"/></marker></defs>
<line x1="90" y1="420" x2="900" y2="420" stroke="#666666" stroke-width="1.6"/>
<line x1="90" y1="420" x2="90" y2="120" stroke="#666666" stroke-width="1.6"/>
<text x="80" y="130" text-anchor="end" font-size="12" fill="#666666" font-weight="normal">行为差异</text>
<text x="900" y="448" text-anchor="end" font-size="12" fill="#666666" font-weight="normal">情境强度</text>
<path d="M 110 170 C 300 180 500 300 880 390" fill="none" stroke="#2f6db0" stroke-width="2.6"/>
<text x="300" y="170" text-anchor="middle" font-size="13" fill="#2f6db0" font-weight="normal">强情境：大家表现差不多</text>
<text x="720" y="380" text-anchor="middle" font-size="13" fill="#2f6db0" font-weight="normal">弱情境：个体差异显现</text>
<rect x="110" y="140" width="240" height="60" fill="#ef6c00" opacity="0.12"/>
<text x="230" y="260" text-anchor="middle" font-size="11" fill="#ef6c00" font-weight="normal">从众、服从、紧急事件</text>
<text x="700" y="300" text-anchor="middle" font-size="11" fill="#2e7d32" font-weight="normal">日常选择、兴趣、关系</text>
<text x="500" y="490" text-anchor="middle" font-size="13" fill="#666666" font-weight="normal">“情境的力量”与“个体差异”不是对立，是同一个交互的两端。</text>
</svg>