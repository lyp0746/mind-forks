<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif">
<rect width="1000" height="600" fill="#ffffff"/>
<text x="500" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">三种“深度”：弗洛伊德、荣格、阿德勒</text>
<text x="500" y="62" text-anchor="middle" font-size="14" fill="#666666">同一个词，三种不同的对象</text>
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"
markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#666666"/></marker></defs>
<rect x="60" y="110" width="280" height="380" rx="10" fill="#fbfcfe" stroke="#2f6db0" stroke-width="1.4"/>
<text x="200" y="150" text-anchor="middle" font-size="20" fill="#2f6db0" font-weight="bold">弗洛伊德</text>
<text x="200" y="190" text-anchor="middle" font-size="16" fill="#1a1a1a" font-weight="bold">个人无意识</text>
<text x="200" y="230" text-anchor="middle" font-size="12" fill="#666666" font-weight="normal">童年经验、性驱力、压抑</text>
<line x1="90" y1="255" x2="310" y2="255" stroke="#dddddd" stroke-width="1"/>
<text x="200" y="285" text-anchor="middle" font-size="12" fill="#666666" font-weight="normal">解释权在谁手里？</text>
<text x="200" y="315" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="normal">解码：梦、移情、自由联想</text>
<text x="200" y="430" text-anchor="middle" font-size="13" fill="#2f6db0" font-weight="bold">诊所里的分析师</text>
<rect x="370" y="110" width="280" height="380" rx="10" fill="#fbfcfe" stroke="#8e5a9c" stroke-width="1.4"/>
<text x="510" y="150" text-anchor="middle" font-size="20" fill="#8e5a9c" font-weight="bold">荣格</text>
<text x="510" y="190" text-anchor="middle" font-size="16" fill="#1a1a1a" font-weight="bold">集体无意识</text>
<text x="510" y="230" text-anchor="middle" font-size="12" fill="#666666" font-weight="normal">原型、神话、宗教象征</text>
<line x1="400" y1="255" x2="620" y2="255" stroke="#dddddd" stroke-width="1"/>
<text x="510" y="285" text-anchor="middle" font-size="12" fill="#666666" font-weight="normal">解释权在谁手里？</text>
<text x="510" y="315" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="normal">解码：跨文化比较、象征学</text>
<text x="510" y="430" text-anchor="middle" font-size="13" fill="#8e5a9c" font-weight="bold">博学的象征学家</text>
<rect x="680" y="110" width="280" height="380" rx="10" fill="#fbfcfe" stroke="#2e7d32" stroke-width="1.4"/>
<text x="820" y="150" text-anchor="middle" font-size="20" fill="#2e7d32" font-weight="bold">阿德勒</text>
<text x="820" y="190" text-anchor="middle" font-size="16" fill="#1a1a1a" font-weight="bold">生活风格</text>
<text x="820" y="230" text-anchor="middle" font-size="12" fill="#666666" font-weight="normal">自卑、补偿、社会兴趣</text>
<line x1="710" y1="255" x2="930" y2="255" stroke="#dddddd" stroke-width="1"/>
<text x="820" y="285" text-anchor="middle" font-size="12" fill="#666666" font-weight="normal">解释权在谁手里？</text>
<text x="820" y="315" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="normal">解码：目标、行为模式、教育观察</text>
<text x="820" y="430" text-anchor="middle" font-size="13" fill="#2e7d32" font-weight="bold">教师与家长</text>
<text x="500" y="550" text-anchor="middle" font-size="13" fill="#666666" font-weight="normal">三个人都相信“深度”；分歧在于深度在哪里、谁有资格解释它。</text>
</svg>