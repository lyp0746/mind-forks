<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif">
<rect width="1000" height="700" fill="#ffffff"/>
<text x="500" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">全书结构：六部分、二十五章、一条暗线</text>
<text x="500" y="62" text-anchor="middle" font-size="14" fill="#666666">每一部分以一个核心为主提问，同时把前一个核心的成果带在身后</text>
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"
markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#666666"/></marker></defs>
<rect x="80" y="92" width="840" height="82" rx="10" fill="#fbfcfe" stroke="#2f6db0" stroke-width="1.4"/>
<text x="112" y="124" text-anchor="start" font-size="19" fill="#2f6db0" font-weight="bold">一　划线的诞生</text>
<text x="112" y="150" text-anchor="start" font-size="13" fill="#666666" font-weight="normal">哲学 · 冯特 · 构造/机能 · 格式塔</text>
<text x="700" y="122" text-anchor="start" font-size="15" fill="#1a1a1a" font-weight="normal">主核：看见 / 记住</text>
<text x="700" y="148" text-anchor="start" font-size="13" fill="#666666" font-weight="normal">第 1—4 章</text>
<line x1="500" y1="176" x2="500" y2="192" stroke="#666666" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="80" y="192" width="840" height="82" rx="10" fill="#fbfcfe" stroke="#2e7d32" stroke-width="1.4"/>
<text x="112" y="224" text-anchor="start" font-size="19" fill="#2e7d32" font-weight="bold">二　深度的代价</text>
<text x="112" y="250" text-anchor="start" font-size="13" fill="#666666" font-weight="normal">精神分析全谱系 · 心理测量</text>
<text x="700" y="222" text-anchor="start" font-size="15" fill="#1a1a1a" font-weight="normal">主核：记住 / 选择</text>
<text x="700" y="248" text-anchor="start" font-size="13" fill="#666666" font-weight="normal">第 5—11 章</text>
<line x1="500" y1="276" x2="500" y2="292" stroke="#666666" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="80" y="292" width="840" height="82" rx="10" fill="#fbfcfe" stroke="#ef6c00" stroke-width="1.4"/>
<text x="112" y="324" text-anchor="start" font-size="19" fill="#ef6c00" font-weight="bold">三　可观察的约束</text>
<text x="112" y="350" text-anchor="start" font-size="13" fill="#666666" font-weight="normal">行为主义 · 斯金纳 · 行为疗法</text>
<text x="700" y="322" text-anchor="start" font-size="15" fill="#1a1a1a" font-weight="normal">主核：看见 / 讲述</text>
<text x="700" y="348" text-anchor="start" font-size="13" fill="#666666" font-weight="normal">第 12—15 章</text>
<line x1="500" y1="376" x2="500" y2="392" stroke="#666666" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="80" y="392" width="840" height="82" rx="10" fill="#fbfcfe" stroke="#8e5a9c" stroke-width="1.4"/>
<text x="112" y="424" text-anchor="start" font-size="19" fill="#8e5a9c" font-weight="bold">四　内部的回归</text>
<text x="112" y="450" text-anchor="start" font-size="13" fill="#666666" font-weight="normal">认知革命 · 皮亚杰/乔姆斯基 · 神经 · 社会</text>
<text x="700" y="422" text-anchor="start" font-size="15" fill="#1a1a1a" font-weight="normal">主核：看见 / 记住</text>
<text x="700" y="448" text-anchor="start" font-size="13" fill="#666666" font-weight="normal">第 16—19 章</text>
<line x1="500" y1="476" x2="500" y2="492" stroke="#666666" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="80" y="492" width="840" height="82" rx="10" fill="#fbfcfe" stroke="#b8862f" stroke-width="1.4"/>
<text x="112" y="524" text-anchor="start" font-size="19" fill="#b8862f" font-weight="bold">五　意义与时间</text>
<text x="112" y="550" text-anchor="start" font-size="13" fill="#666666" font-weight="normal">人本 · 存在 · 发展</text>
<text x="700" y="522" text-anchor="start" font-size="15" fill="#1a1a1a" font-weight="normal">主核：选择 / 跟上</text>
<text x="700" y="548" text-anchor="start" font-size="13" fill="#666666" font-weight="normal">第 20—22 章</text>
<line x1="500" y1="576" x2="500" y2="592" stroke="#666666" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="80" y="592" width="840" height="82" rx="10" fill="#fbfcfe" stroke="#c62828" stroke-width="1.4"/>
<text x="112" y="624" text-anchor="start" font-size="19" fill="#c62828" font-weight="bold">六　系统与定价</text>
<text x="112" y="650" text-anchor="start" font-size="13" fill="#666666" font-weight="normal">系统/后现代 · 当代 · 回望</text>
<text x="700" y="622" text-anchor="start" font-size="15" fill="#1a1a1a" font-weight="normal">主核：讲述 / 临界</text>
<text x="700" y="648" text-anchor="start" font-size="13" fill="#666666" font-weight="normal">第 23—25 章</text>
</svg>