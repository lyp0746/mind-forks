<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Microsoft YaHei, PingFang SC, SimHei, sans-serif">
<rect width="1000" height="520" fill="#ffffff"/>
<text x="500" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">陌生情境：八个小节，二十分钟</text>
<text x="500" y="62" text-anchor="middle" font-size="14" fill="#666666">分离与重聚被压缩成一次可观察的压力测试</text>
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"
markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#666666"/></marker></defs>
<rect x="80" y="140" width="84" height="70" fill="#2f6db0" opacity="0.18" stroke="#2f6db0" stroke-width="1.2"/>
<text x="122.0" y="172" text-anchor="middle" font-size="11" fill="#2f6db0" font-weight="bold">母子 进入</text>
<text x="122.0" y="196" text-anchor="middle" font-size="10" fill="#666666" font-weight="normal">0—2′</text>
<rect x="164" y="140" width="84" height="70" fill="#2f6db0" opacity="0.18" stroke="#2f6db0" stroke-width="1.2"/>
<text x="206.0" y="172" text-anchor="middle" font-size="11" fill="#2f6db0" font-weight="bold">母亲 坐下</text>
<text x="206.0" y="196" text-anchor="middle" font-size="10" fill="#666666" font-weight="normal">2—4′</text>
<rect x="248" y="140" width="84" height="70" fill="#ef6c00" opacity="0.18" stroke="#ef6c00" stroke-width="1.2"/>
<text x="290.0" y="172" text-anchor="middle" font-size="11" fill="#ef6c00" font-weight="bold">陌生人 进入</text>
<text x="290.0" y="196" text-anchor="middle" font-size="10" fill="#666666" font-weight="normal">4—6′</text>
<rect x="332" y="140" width="84" height="70" fill="#c62828" opacity="0.18" stroke="#c62828" stroke-width="1.2"/>
<text x="374.0" y="172" text-anchor="middle" font-size="11" fill="#c62828" font-weight="bold">母亲 离开</text>
<text x="374.0" y="196" text-anchor="middle" font-size="10" fill="#666666" font-weight="normal">6—8′</text>
<rect x="416" y="140" width="84" height="70" fill="#ef6c00" opacity="0.18" stroke="#ef6c00" stroke-width="1.2"/>
<text x="458.0" y="172" text-anchor="middle" font-size="11" fill="#ef6c00" font-weight="bold">陌生人 安抚</text>
<text x="458.0" y="196" text-anchor="middle" font-size="10" fill="#666666" font-weight="normal">8—10′</text>
<rect x="500" y="140" width="84" height="70" fill="#2e7d32" opacity="0.18" stroke="#2e7d32" stroke-width="1.2"/>
<text x="542.0" y="172" text-anchor="middle" font-size="11" fill="#2e7d32" font-weight="bold">母亲 回来</text>
<text x="542.0" y="196" text-anchor="middle" font-size="10" fill="#666666" font-weight="normal">10—12′</text>
<rect x="584" y="140" width="84" height="70" fill="#c62828" opacity="0.18" stroke="#c62828" stroke-width="1.2"/>
<text x="626.0" y="172" text-anchor="middle" font-size="11" fill="#c62828" font-weight="bold">母亲 再离开</text>
<text x="626.0" y="196" text-anchor="middle" font-size="10" fill="#666666" font-weight="normal">12—14′</text>
<rect x="668" y="140" width="84" height="70" fill="#ef6c00" opacity="0.18" stroke="#ef6c00" stroke-width="1.2"/>
<text x="710.0" y="172" text-anchor="middle" font-size="11" fill="#ef6c00" font-weight="bold">陌生人 回来</text>
<text x="710.0" y="196" text-anchor="middle" font-size="10" fill="#666666" font-weight="normal">14—16′</text>
<rect x="752" y="140" width="168" height="70" fill="#2e7d32" opacity="0.18" stroke="#2e7d32" stroke-width="1.2"/>
<text x="836.0" y="172" text-anchor="middle" font-size="11" fill="#2e7d32" font-weight="bold">母亲 回来</text>
<text x="836.0" y="196" text-anchor="middle" font-size="10" fill="#666666" font-weight="normal">16—20′</text>
<line x1="80" y1="240" x2="920" y2="240" stroke="#666666" stroke-width="2"/>
<text x="80" y="268" text-anchor="start" font-size="11" fill="#666666" font-weight="normal">0 分钟</text>
<text x="920" y="268" text-anchor="end" font-size="11" fill="#666666" font-weight="normal">20 分钟</text>
<text x="500" y="320" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="bold">孩子的反应（示意）</text>
<path d="M 80 360 L 250 360 L 330 400 L 420 420 L 500 400 L 580 370 L 660 420 L 740 430 L 820 375 L 920 370" fill="none" stroke="#8e5a9c" stroke-width="2.5"/>
<text x="420" y="450" text-anchor="middle" font-size="12" fill="#c62828" font-weight="normal">分离 → 焦虑/哭泣</text>
<text x="820" y="350" text-anchor="middle" font-size="12" fill="#2e7d32" font-weight="normal">重聚 → 被安抚</text>
<text x="500" y="490" text-anchor="middle" font-size="12" fill="#666666" font-weight="normal">四种类型（安全/回避/矛盾/混乱）描述的是“如何用照顾者作为安全基地”，不是人格类型。</text>
</svg>